name: REALM 717 Android APK Updater CI
on:
  push:
    branches: [feature/work-717-app-installer]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verified Godot and Android template source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'templates.tpz'
          with zipfile.ZipFile(src) as archive:
              names=[x for x in archive.namelist() if 'android_source.zip' in x]
              assert len(names)==1,names
              b=archive.read(names[0])
              dst=Path(os.environ['RUNNER_TEMP'])/'android_source.zip'
              dst.write_bytes(b)
          with zipfile.ZipFile(dst) as archive:
              hits=[x for x in archive.namelist() if x.endswith('AndroidManifest.xml') or x.endswith('build.gradle') or 'gradle-wrapper' in x or x.endswith('gradlew') or x.endswith('settings.gradle')]
              print("REALM_717_TEMPLATE_ENTRIES",hits[:36])
          PY
      - name: Godot native unit tests and script import
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path godot/realm_alliance --import
          timeout 90s "$GODOT" --headless --path godot/realm_alliance --script res://tests/test_app_update717.gd
          timeout 90s "$GODOT" --headless --path godot/realm_alliance --script res://tests/test_guest_reset716.gd
      - name: Export verified web build
        run: |
          python3 development/build_web716.py --godot "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --output "$RUNNER_TEMP/realm717"
          test -s "$RUNNER_TEMP/realm717/index.pck"
