name: REALM Godot Combat Foundation

on:
  push:
    branches:
      - feature/godot-combat-foundation-01
    paths:
      - 'godot/realm_alliance/**'
      - '.github/workflows/godot-combat-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    defaults:
      run:
        working-directory: godot/realm_alliance
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot export templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.6.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.6.3.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
      - name: Import project
        run: godot --headless --path . --import
      - name: Model regression tests
        run: godot --headless --path . --script res://tests/test_combat.gd
      - name: Build Web debug artifact
        run: |
          mkdir -p ../../build/godot-web
          godot --headless --path . --export-debug "Web" ../../build/godot-web/index.html
      - name: Upload isolated Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: realm-alliance-godot-web-poc
          path: build/godot-web/
          if-no-files-found: error
