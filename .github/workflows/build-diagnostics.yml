name: Build diagnostics
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.txt 2>&1
          code=$?
          cat typecheck.txt
          {
            echo '## TypeScript diagnostics'
            echo '~~~'
            cat typecheck.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
