name: REALM 715 Content Packs and Guest Reset
on:
  push:
    branches: [feature/work-715-asset-updater]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verified Godot 4.7.2
        run: |
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import game and run launcher checks
        run: |
          export GAME="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$GAME" --headless --path godot/realm_alliance --import
          "$GAME" --headless --path godot/realm_alliance --script res://tests/test_content715.gd
      - name: Verify public PNG + JSON content checksums over HTTPS
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          base='https://raw.githubusercontent.com/Broosskyy/Realm-Alliance/distribution/realm-715-test/godot/realm_alliance/data/'
          manifest=json.loads(urllib.request.urlopen(base+'update715_manifest.json',timeout=15).read())
          assert manifest['schema']==3 and len(manifest['packs'])==2
          for p in manifest['packs']:
              body=urllib.request.urlopen(p['url'],timeout=15).read()
              assert len(body)==p['bytes'] and hashlib.sha256(body).hexdigest()==p['sha256'],p['id']
              print('REMOTE 715 PASS',p['id'],len(body))
          PY
      - name: Create normal web build
        run: |
          python3 development/build_web715.py --godot "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --output "$RUNNER_TEMP/realm715"
          python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d=json.loads((p/"BUILD_715.json").read_text()); assert d["version"]==715 and not d["qa"]; assert (p/"index.pck").stat().st_size>0' "$RUNNER_TEMP/realm715"
      - uses: actions/upload-artifact@v4
        with:
          name: REALM_715_Launcher_Web
          path: ${{ runner.temp }}/realm715/
          retention-days: 30
